<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgelight panel preview</title>
<!--
  Visual preview of the Forgelight panel outside VS Code. Loads the real media/panel.css and
  media/panel.js, stubs acquireVsCodeApi, applies VS Code "Dark Modern" theme variables and
  replays a recorded ForgeEvent stream (record one with the headless harness: --events-out).
  Serve the repo root over HTTP and open:
    /test/panel-preview/index.html?events=taskB.events.jsonl&speed=30
  Add &theme=light for a light theme.
-->
<style id="theme-dark">
  :root {
    --vscode-foreground: #cccccc; --vscode-descriptionForeground: #9d9d9d; --vscode-errorForeground: #f85149;
    --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --vscode-font-size: 13px;
    --vscode-editor-font-family: Menlo, Monaco, "Courier New", monospace; --vscode-editor-font-size: 12px;
    --vscode-editor-background: #1f1f1f; --vscode-sideBar-background: #181818; --vscode-editorWidget-background: #202020;
    --vscode-button-background: #0078d4; --vscode-button-foreground: #ffffff; --vscode-button-hoverBackground: #026ec1;
    --vscode-button-secondaryBackground: #313131; --vscode-button-secondaryForeground: #cccccc; --vscode-button-secondaryHoverBackground: #3c3c3c;
    --vscode-button-border: #ffffff12; --vscode-widget-border: #313131; --vscode-panel-border: #2b2b2b; --vscode-focusBorder: #0078d4;
    --vscode-toolbar-hoverBackground: #5a5d5e50; --vscode-list-hoverBackground: #2a2d2e;
    --vscode-textPreformat-foreground: #d0d0d0; --vscode-textLink-foreground: #4daafc; --vscode-textLink-activeForeground: #4daafc; --vscode-textCodeBlock-background: #2b2b2b;
    --vscode-testing-iconPassed: #73c991; --vscode-editorWarning-foreground: #cca700; --vscode-editorInfo-foreground: #3794ff;
    --vscode-keybindingLabel-background: #8080802b; --vscode-keybindingLabel-foreground: #cccccc; --vscode-keybindingLabel-border: #33333399;
    --vscode-input-background: #313131; --vscode-input-foreground: #cccccc; --vscode-input-border: #3c3c3c; --vscode-input-placeholderForeground: #989898;
    --vscode-gitDecoration-deletedResourceForeground: #c74e39; --vscode-gitDecoration-addedResourceForeground: #81b88b;
    --vscode-diffEditor-removedTextBackground: #ff000033; --vscode-diffEditor-removedLineBackground: #ff000033;
    --vscode-diffEditor-insertedTextBackground: #9ccc2c33; --vscode-diffEditor-insertedLineBackground: #9bb95533;
    --vscode-charts-yellow: #cca700; --vscode-charts-red: #f14c4c; --vscode-charts-purple: #b180d7; --vscode-charts-green: #89d185; --vscode-charts-blue: #3794ff;
    --vscode-badge-background: #616161; --vscode-badge-foreground: #f8f8f8;
  }
  html, body { background: var(--vscode-sideBar-background); color: var(--vscode-foreground); margin: 0; }
</style>
<style id="theme-light" media="not all">
  :root {
    --vscode-foreground: #3b3b3b; --vscode-descriptionForeground: #717171; --vscode-errorForeground: #f85149;
    --vscode-editor-background: #ffffff; --vscode-sideBar-background: #f8f8f8; --vscode-editorWidget-background: #f8f8f8;
    --vscode-button-secondaryBackground: #e5e5e5; --vscode-button-secondaryForeground: #3b3b3b; --vscode-button-secondaryHoverBackground: #cccccc;
    --vscode-widget-border: #e5e5e5; --vscode-panel-border: #e5e5e5; --vscode-list-hoverBackground: #f2f2f2; --vscode-toolbar-hoverBackground: #b8b8b850;
    --vscode-textPreformat-foreground: #3b3b3b; --vscode-textLink-foreground: #005fb8; --vscode-textLink-activeForeground: #005fb8; --vscode-textCodeBlock-background: #f0f0f0;
    --vscode-input-background: #ffffff; --vscode-input-foreground: #3b3b3b; --vscode-input-border: #cecece; --vscode-input-placeholderForeground: #767676;
    --vscode-keybindingLabel-foreground: #3b3b3b; --vscode-keybindingLabel-border: #cccccc99;
    --vscode-button-background: #005fb8; --vscode-button-hoverBackground: #0258a8; --vscode-focusBorder: #005fb8;
    --vscode-errorForeground: #a1260d; --vscode-testing-iconPassed: #388a34; --vscode-editorWarning-foreground: #bf8803; --vscode-editorInfo-foreground: #1a85ff;
    --vscode-charts-yellow: #bf8803; --vscode-charts-red: #e51400; --vscode-charts-purple: #652d90; --vscode-charts-green: #388a34; --vscode-charts-blue: #1a85ff; --vscode-charts-orange: #d18616;
    --vscode-gitDecoration-addedResourceForeground: #587c0c; --vscode-gitDecoration-deletedResourceForeground: #ad0707;
    --vscode-diffEditor-insertedLineBackground: #9bb95533; --vscode-diffEditor-removedLineBackground: #ff000033;
    --vscode-badge-background: #cccccc; --vscode-badge-foreground: #3b3b3b;
  }
</style>
<link rel="stylesheet" href="../../media/panel.css">
<style>
  #preview-bar { position: fixed; bottom: 0; right: 0; z-index: 99; font: 11px var(--vscode-font-family); background: #000a; color: #fff; padding: 2px 6px; border-top-left-radius: 4px; }
</style>
</head>
<body data-platform="darwin">
<div id="app">
  <header id="header">
    <div class="hdr-row">
      <span class="brand"><span class="brand-mark" id="brand-mark"></span>Forgelight</span>
      <span id="status-dot" class="status-dot idle" title="Idle"></span>
      <span id="status-text" class="status-text">Idle</span>
      <span class="spacer"></span>
      <button id="open-session" class="link-btn" hidden title="Open the current session in TrueForge"></button>
      <button id="undo" class="icon-btn" title="Undo the last applied change"></button>
    </div>
    <div class="hdr-row chain-row">
      <span class="chain-label">Models</span>
      <span id="model-chain" class="model-chain"></span>
    </div>
  </header>
  <main id="transcript">
    <section id="empty" class="empty"></section>
    <div id="log"></div>
    <button id="jump" class="jump" type="button" hidden>&#8595; Jump to latest</button>
  </main>
  <footer id="composer">
    <div class="composer-box">
      <textarea id="input" rows="1" placeholder="Ask Forgelight… use @path/to/file.py or @symbol to add context" aria-label="Message Forgelight"></textarea>
      <button id="send" class="send-btn" title="Send (Enter)"></button>
    </div>
    <div id="hint" class="hint"></div>
  </footer>
</div>
<div id="preview-bar">preview</div>
<script src="shim.js"></script>
<script src="../../media/panel.js"></script>
<script src="replay.js"></script>
</body>
</html>
